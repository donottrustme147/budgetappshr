<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monzo shared</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f4f1ee;--card:#fff;--text:#14233c;--mute:#6b7585;--line:#e8e2dc;--acc:#ff4f40;--pos:#14996a;--neg:#d6283c;--navy:#14233c;--tint:#ffe9e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1626;--card:#14233c;--text:#f4f1ee;--mute:#9aa6b8;--line:#243350;--acc:#ff6b5e;--pos:#3fd3a0;--neg:#ff7a8a;--navy:#0a1220;--tint:#3a2230}}
:root[data-theme="dark"]{--bg:#0c1626;--card:#14233c;--text:#f4f1ee;--mute:#9aa6b8;--line:#243350;--acc:#ff6b5e;--pos:#3fd3a0;--neg:#ff7a8a;--navy:#0a1220;--tint:#3a2230}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Roboto,sans-serif;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px}
header{background:var(--navy);color:#fff;border-radius:0 0 18px 18px;padding:14px 16px}
header h1{font-size:19px;margin:0;color:#fff}
header small{color:#ffb4ad!important}
.sum div{border-top:3px solid var(--acc)}
.cell.today{background:var(--tint)}
.cell.today .n{color:var(--acc)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.icon{font-size:22px;padding:6px 12px;border-radius:10px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px 10px}
.sum div{background:var(--card);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--mute)}
.sum b{display:block;font-size:15px;color:var(--text);margin-top:2px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:4px 8px}
.nav span{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:6px 8px}
.dow{font-size:11px;color:var(--mute);text-align:center}
.cell{background:var(--card);border-radius:8px;min-height:58px;padding:4px 3px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;border:2px solid transparent}
.cell.today{border-color:var(--acc)}
.cell.empty{background:none}
.cell .n{font-size:13px;font-weight:600}
.cell .net{font-size:10px;font-weight:600}
.cell .bal{font-size:10px;color:var(--mute)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet-bg.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow-y:auto}
.sheet h2{margin:0 0 10px;font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.row small{color:var(--mute);display:block}
.del{color:var(--neg);padding:6px 10px}
.ed{color:var(--acc);padding:6px 10px;font-size:16px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.sheet.day{display:flex;flex-direction:column;overflow:hidden}
#dayList{flex:1 1 auto;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
#dayForm{flex:none;border-top:1px solid var(--line);padding-top:4px;margin-top:8px;background:var(--card)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--mute);flex:none;padding:0;font-size:15px;line-height:1;color:#fff;display:inline-flex;align-items:center;justify-content:center}
.chk.on{background:var(--pos);border-color:var(--pos)}
.row.done .nm{opacity:.55}
.ck{color:var(--pos);font-size:11px}
input,select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-top:8px}
.tog{display:flex;gap:8px;margin-top:8px}
.tog button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line)}
.tog button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.primary{width:100%;margin-top:12px;padding:12px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600}
.lbl{font-size:12px;color:var(--mute);margin-top:12px}
</style>
</head>
<body>
<header><div><h1>Monzo shared</h1><small id="status" style="font-size:11px">Saved on this phone only</small></div><button class="icon" id="gear">⚙️</button></header>
<div class="sum">
  <div>Balance at month end<b id="sEnd"></b></div>
  <div>Money in<b id="sIn"></b></div>
  <div>Money out<b id="sOut"></b></div>
</div>
<div class="nav"><button class="icon" id="prev">‹</button><span id="title"></span><button class="icon" id="next">›</button></div>
<div class="grid" id="dows"></div>
<div class="grid" id="grid"></div>

<div class="sheet-bg" id="bg"><div class="sheet" id="sheet"></div></div>

<script>
var state={start:0,cur:'$',items:[]};
var db=null;
try{var s0=localStorage.getItem('monzo-shared-v1');if(s0)state=JSON.parse(s0)}catch(e){}
function save(){if(db)return;try{localStorage.setItem('monzo-shared-v1',JSON.stringify(state))}catch(e){}}
function fail(e){alert('Could not save: '+((e&&e.message)||'unknown error'))}
function setStatus(t){document.getElementById('status').textContent=t}
function showSetup(){
  var cfgTxt='';try{cfgTxt=localStorage.getItem('ms-config-raw')||''}catch(e){}
  var fam='';try{fam=localStorage.getItem('ms-fam')||''}catch(e){}
  sheet.className='sheet';sheet.innerHTML='<h2>Sync setup</h2><div class="lbl">Paste your Firebase config (the block starting with const firebaseConfig = {...})</div>'+
  '<textarea id="cCfg" rows="6" style="width:100%;font:12px monospace;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-top:8px">'+esc(cfgTxt)+'</textarea>'+
  '<div class="lbl">Family code (long and secret, same on both phones)</div><input id="cFam" value="'+esc(fam)+'" placeholder="e.g. smith-household-7f3k29xq">'+
  '<button class="primary" id="cSave">Save and connect</button>'+
  '<button class="primary" id="cOff" style="background:var(--mute)">Use on this phone only</button>';
  bg.classList.add('on');
  document.getElementById('cSave').onclick=function(){
    var raw=document.getElementById('cCfg').value,cfg={},m,re=/(\w+)\s*:\s*["']([^"']*)["']/g;
    while((m=re.exec(raw)))cfg[m[1]]=m[2];
    var code=document.getElementById('cFam').value.trim();
    if(!cfg.apiKey||!cfg.projectId){alert('Could not read the config. Paste the whole block from Firebase.');return}
    if(code.length<8||/[\/\s]/.test(code)){alert('Family code: at least 8 characters, no spaces or slashes.');return}
    try{localStorage.setItem('ms-config',JSON.stringify(cfg));localStorage.setItem('ms-config-raw',raw);localStorage.setItem('ms-fam',code);localStorage.removeItem('ms-local')}catch(e){alert('Could not store settings in this browser.');return}
    location.reload();
  };
  document.getElementById('cOff').onclick=function(){try{localStorage.setItem('ms-local','1');localStorage.removeItem('ms-config')}catch(e){}location.reload()};
}
function init(){
  var cfg=null,fam=null,loc=false;
  try{cfg=JSON.parse(localStorage.getItem('ms-config'));fam=localStorage.getItem('ms-fam');loc=localStorage.getItem('ms-local')}catch(e){}
  if(!cfg||!fam){if(!loc)showSetup();return}
  if(typeof firebase==='undefined'){setStatus('Offline: could not load sync');return}
  try{
    firebase.initializeApp(cfg);
    var f=firebase.firestore();
    f.enablePersistence().catch(function(){});
    var base='families/'+fam;
    db={collection:function(n){return f.collection(base+'/'+n)},doc:function(p){return f.doc(base+'/'+p)}};
    state={start:0,cur:'$',items:[]};
    var unsubs=[];
    var stop=function(){unsubs.forEach(function(u){u()});unsubs=[];state.items=[];render()};
    var go=function(){
      setStatus('Connecting...');
      unsubs.push(db.collection('transactions').onSnapshot(function(snap){state.items=snap.docs.map(function(d){return d.data()});setStatus('● Shared & synced');render()},function(err){setStatus(err&&err.code==='permission-denied'?'● Access denied: check your Firebase rules':'● Sync error')}));
      unsubs.push(db.doc('settings/main').onSnapshot(function(d){if(d.exists){var v=d.data();state.start=v.start||0;state.cur=v.cur||'$'}render()},function(){}));
    };
    go();
  }catch(e){db=null;setStatus('Sync error: '+e.message)}
}

function pad(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function money(n){var v=Math.abs(n).toFixed(2);return(n<0?'-':'')+state.cur+v.replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function short(n){var a=Math.abs(n),t=a>=10000?(a/1000).toFixed(0)+'k':a>=1000?(a/1000).toFixed(1)+'k':Math.round(a);return(n<0?'-':'')+t}
var view=new Date();view.setDate(1);

function occurrences(t,end){
  var out=[],b=parse(t.date),i=0;
  while(i<2000){
    if(t.count&&i>=t.count)break;
    var d;
    if(t.repeat==='weekly')d=new Date(b.getFullYear(),b.getMonth(),b.getDate()+7*i);
    else if(t.repeat==='biweekly')d=new Date(b.getFullYear(),b.getMonth(),b.getDate()+14*i);
    else if(t.repeat==='fourweekly')d=new Date(b.getFullYear(),b.getMonth(),b.getDate()+28*i);
    else if(t.repeat==='monthly'){var dim=new Date(b.getFullYear(),b.getMonth()+i+1,0).getDate();d=new Date(b.getFullYear(),b.getMonth()+i,Math.min(b.getDate(),dim))}
    else d=b;
    if(d>end)break;
    if(t.until&&ymd(d)>=t.until)break;
    var k=ymd(d);if(!(t.skip&&t.skip.indexOf(k)>-1))out.push(k);
    if(!t.repeat||t.repeat==='none')break;
    i++;
  }
  return out;
}
function build(end){
  var map={};
  state.items.forEach(function(t){occurrences(t,end).forEach(function(ds){(map[ds]=map[ds]||[]).push(t)})});
  var keys=Object.keys(map).sort(),bal={},cbal={},run=Math.round((Number(state.start)||0)*100),crun=run;
  if(keys.length){
    var d=parse(keys[0]);
    while(d<=end){
      var ds=ymd(d);
      (map[ds]||[]).forEach(function(t){
        var p=Math.round(t.amt*100)*(t.type==='in'?1:-1);
        run+=p;
        if((t.clr||[]).indexOf(ds)>-1)crun+=p;
      });
      bal[ds]=run/100;cbal[ds]=crun/100;
      d.setDate(d.getDate()+1);
    }
  }
  return{map:map,bal:bal,cbal:cbal,first:keys[0]};
}
function render(){
  var y=view.getFullYear(),m=view.getMonth(),last=new Date(y,m+1,0);
  var r=build(last),g=document.getElementById('grid');
  document.getElementById('title').textContent=view.toLocaleString('default',{month:'long',year:'numeric'});
  var h='',off=(view.getDay()+6)%7,inn=0,out=0,today=ymd(new Date());
  for(var i=0;i<off;i++)h+='<div class="cell empty"></div>';
  for(var d=1;d<=last.getDate();d++){
    var ds=y+'-'+pad(m+1)+'-'+pad(d),list=r.map[ds]||[],net=0;
    list.forEach(function(t){if(t.type==='in'){net+=t.amt;inn+=t.amt}else{net-=t.amt;out+=t.amt}});
    var allClr=list.length>0&&list.every(function(t){return(t.clr||[]).indexOf(ds)>-1});
    var b=(ds in r.bal)?r.bal[ds]:(Number(state.start)||0);
    h+='<button class="cell'+(ds===today?' today':'')+'" data-d="'+ds+'"><span class="n">'+d+(allClr?' <span class="ck">✓</span>':'')+'</span>'+
      '<span class="net '+(net>0?'pos':net<0?'neg':'')+'">'+(list.length?(net>0?'+':'')+short(net):'&nbsp;')+'</span>'+
      '<span class="bal '+(b<0?'neg':'')+'">'+short(b)+'</span></button>';
  }
  g.innerHTML=h;
  var endBal=(ymd(last) in r.bal)?r.bal[ymd(last)]:(Number(state.start)||0);
  var e=document.getElementById('sEnd');e.textContent=money(endBal);e.className=endBal<0?'neg':'';
  document.getElementById('sIn').textContent=money(inn);
  document.getElementById('sOut').textContent=money(out);
}
document.getElementById('dows').innerHTML=['M','T','W','T','F','S','S'].map(function(x){return'<div class="dow">'+x+'</div>'}).join('');
document.getElementById('prev').onclick=function(){view.setMonth(view.getMonth()-1);render()};
document.getElementById('next').onclick=function(){view.setMonth(view.getMonth()+1);render()};
document.getElementById('grid').onclick=function(e){var c=e.target.closest('.cell[data-d]');if(c)openDay(c.dataset.d)};
var bg=document.getElementById('bg'),sheet=document.getElementById('sheet');
bg.onclick=function(e){if(e.target===bg)closeSheet()};
function closeSheet(){bg.classList.remove('on');render()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var type='out';
function countBefore(t,ds){
  var p=parse(ds),e=new Date(p.getFullYear(),p.getMonth(),p.getDate()-1);
  return occurrences({date:t.date,repeat:t.repeat},e).length;
}
function repLabel(r){return({weekly:'weekly',biweekly:'every 2 weeks',fourweekly:'every 4 weeks',monthly:'monthly'})[r]||r}
function openDay(ds,mode){
  var pl=document.getElementById('dayList'),st=(pl&&sheet.dataset.day===ds)?pl.scrollTop:0;
  if(mode!=='add')type='out';
  var r=build(parse(ds)),list=r.map[ds]||[];
  var startBal=Math.round((Number(state.start)||0)*100)/100;
  var endBal=(ds in r.bal)?r.bal[ds]:startBal,clrBal=(ds in r.cbal)?r.cbal[ds]:startBal;
  var dayNet=0;list.forEach(function(t){dayNet+=Math.round(t.amt*100)*(t.type==='in'?1:-1)});
  var openBal=(Math.round(endBal*100)-dayNet)/100;dayNet=dayNet/100;
  var h='<h2>'+parse(ds).toLocaleDateString('default',{weekday:'long',day:'numeric',month:'long'})+'</h2>'+
  '<div id="dayStats" style="flex:none;background:var(--bg);border-radius:12px;padding:8px 12px;margin-bottom:6px">'+
  '<div style="font-size:12px;color:var(--mute)">Balance at end of day</div>'+
  '<div style="font-size:22px;font-weight:700" class="'+(endBal<0?'neg':'')+'">'+money(endBal)+'</div>'+
  '<div style="font-size:12px;color:var(--mute);margin-top:4px;line-height:1.5">Start of day: <b style="color:var(--text)">'+money(openBal)+'</b><br>Day total: <b class="'+(dayNet>0?'pos':dayNet<0?'neg':'')+'">'+(dayNet>0?'+':'')+money(dayNet)+'</b><br>Cleared balance: <b style="color:var(--text)">'+money(clrBal)+'</b></div></div><div id="dayList">';
  list.forEach(function(t){
    var cl=(t.clr||[]).indexOf(ds)>-1;
    h+='<div class="row'+(cl?' done':'')+'"><button class="chk'+(cl?' on':'')+'" data-id="'+t.id+'" aria-label="Mark cleared">'+(cl?'✓':'')+'</button><div class="nm" style="flex:1;margin:0 10px">'+esc(t.name)+'<small>'+(t.repeat&&t.repeat!=='none'?'Repeats '+repLabel(t.repeat)+(t.count?' · '+t.count+' times':''):'One-off')+'</small></div>'+
    '<div><span class="'+(t.type==='in'?'pos':'neg')+'">'+(t.type==='in'?'+':'-')+money(t.amt)+'</span><button class="ed" data-id="'+t.id+'">✎</button><button class="del" data-id="'+t.id+'">✕</button></div></div>';
  });
  if(!list.length)h+='<div class="lbl">No transactions this day.</div>';
  h+='</div><div id="dayForm"><div class="tog" style="margin-top:0"><button id="tOut" class="'+(type==='out'?'on':'')+'">Expense</button><button id="tIn" class="'+(type==='in'?'on':'')+'">Income</button></div>'+
  '<div style="display:flex;gap:8px"><input id="fName" placeholder="Description" style="flex:2;width:auto;min-width:0"><input id="fAmt" type="number" inputmode="decimal" placeholder="Amount" style="flex:1;width:auto;min-width:0"></div>'+
  '<div style="display:flex;gap:8px;align-items:center"><select id="fRep" style="flex:1;width:auto;min-width:0"><option value="none">Does not repeat</option><option value="weekly">Weekly</option><option value="biweekly">Every 2 weeks</option><option value="fourweekly">Every 4 weeks</option><option value="monthly">Monthly</option></select>'+
  '<button class="primary" id="fAdd" style="flex:1;width:auto;margin-top:8px">Add</button></div><div id="fCntBox" style="display:none"><input id="fCnt" type="number" inputmode="numeric" min="1" placeholder="Ends after how many transactions? (blank = never)" style="margin-top:2px"></div></div>';
  sheet.className='sheet day';sheet.dataset.day=ds;
  sheet.innerHTML=h;bg.classList.add('on');
  var dl=document.getElementById('dayList');dl.scrollTop=(mode==='add')?dl.scrollHeight:st;
  if(mode==='add')document.getElementById('fName').focus();
  document.getElementById('fRep').onchange=function(){document.getElementById('fCntBox').style.display=this.value==='none'?'none':'block'};
  document.getElementById('fAmt').onkeydown=function(e){if(e.key==='Enter')document.getElementById('fAdd').click()};
  document.getElementById('tOut').onclick=function(){type='out';this.classList.add('on');document.getElementById('tIn').classList.remove('on')};
  document.getElementById('tIn').onclick=function(){type='in';this.classList.add('on');document.getElementById('tOut').classList.remove('on')};
  document.getElementById('fAdd').onclick=function(){
    var a=parseFloat(document.getElementById('fAmt').value);
    if(!a||a<=0){document.getElementById('fAmt').focus();return}
    var it={id:Date.now()+'',name:document.getElementById('fName').value||(type==='in'?'Income':'Expense'),amt:a,type:type,date:ds,repeat:document.getElementById('fRep').value};
    var cn=parseInt(document.getElementById('fCnt').value);if(it.repeat!=='none'&&cn>0)it.count=cn;
    state.items.push(it);
    if(db)db.collection('transactions').doc(it.id).set(it).catch(fail);
    save();openDay(ds,'add');
  };
  sheet.querySelectorAll('.del').forEach(function(b){b.onclick=function(){
    var t=state.items.filter(function(x){return x.id===b.dataset.id})[0];
    if(t&&t.repeat&&t.repeat!=='none'&&!confirm('This deletes the whole repeating series. Continue?'))return;
    state.items=state.items.filter(function(x){return x.id!==b.dataset.id});
    if(db)db.doc('transactions/'+b.dataset.id).delete().catch(fail);
    save();openDay(ds)}});
  sheet.querySelectorAll('.chk').forEach(function(b){b.onclick=function(){
    var t=state.items.filter(function(x){return x.id===b.dataset.id})[0];if(!t)return;
    t.clr=t.clr||[];var i=t.clr.indexOf(ds),was=i>-1;
    if(was)t.clr.splice(i,1);else t.clr.push(ds);
    if(db)db.collection('transactions').doc(t.id).update({clr:was?firebase.firestore.FieldValue.arrayRemove(ds):firebase.firestore.FieldValue.arrayUnion(ds)}).catch(fail);
    save();openDay(ds)}});
  sheet.querySelectorAll('.ed').forEach(function(b){b.onclick=function(){openEdit(b.dataset.id,ds)}});
}
function openEdit(id,ds){
  var t=state.items.filter(function(x){return x.id===id})[0];if(!t)return;
  var etype=t.type,wasRec=t.repeat&&t.repeat!=='none',scope='one';
  var opts=[['none','Does not repeat'],['weekly','Weekly'],['biweekly','Every 2 weeks'],['fourweekly','Every 4 weeks'],['monthly','Monthly']].map(function(o){return'<option value="'+o[0]+'"'+((t.repeat||'none')===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('');
  var notes={one:'Only this date changes. All other dates in the series stay as they are.',fut:'This date and every later one change. Earlier dates stay as they are.',all:'Every date in the series changes, including past ones. Changing the date shifts the whole series.'};
  sheet.className='sheet';sheet.innerHTML='<h2>Edit transaction</h2><div class="tog"><button id="eOut" class="'+(etype==='out'?'on':'')+'">Expense</button><button id="eIn" class="'+(etype==='in'?'on':'')+'">Income</button></div>'+
  '<input id="eName" value="'+esc(t.name)+'"><input id="eAmt" type="number" inputmode="decimal" value="'+t.amt+'">'+
  '<div class="lbl">Date</div><input id="eDate" type="date" value="'+ds+'">'+
  (wasRec?'<div class="lbl">Apply changes to</div><div class="tog"><button id="sOne" class="on">This one</button><button id="sFut">This &amp; future</button><button id="sAll">All</button></div><div class="note" id="eNote">'+notes.one+'</div>':'')+
  '<div id="eRepBox" style="display:'+(wasRec?'none':'block')+'"><div class="lbl">Repeat</div><select id="eRep">'+opts+'</select><div id="eCntBox"><div class="lbl">Ends after (number of transactions, blank = never)</div><input id="eCnt" type="number" inputmode="numeric" min="1" value="'+(t.count||'')+'"></div></div>'+
  '<button class="primary" id="eSave">Save changes</button><button class="primary" id="eCancel" style="background:var(--mute)">Cancel</button>';
  document.getElementById('eOut').onclick=function(){etype='out';this.classList.add('on');document.getElementById('eIn').classList.remove('on')};
  document.getElementById('eIn').onclick=function(){etype='in';this.classList.add('on');document.getElementById('eOut').classList.remove('on')};
  document.getElementById('eCancel').onclick=function(){openDay(ds)};
  var updCnt=function(){document.getElementById('eCntBox').style.display=document.getElementById('eRep').value==='none'?'none':''};
  document.getElementById('eRep').onchange=updCnt;updCnt();
  if(wasRec){
    var setScope=function(k){scope=k;['One','Fut','All'].forEach(function(n){document.getElementById('s'+n).classList.toggle('on',n.toLowerCase()===k)});document.getElementById('eRepBox').style.display=k==='one'?'none':'';document.getElementById('eNote').textContent=notes[k];document.getElementById('eCnt').value=k==='fut'?(t.count?Math.max(1,t.count-countBefore(t,ds)):''):(t.count||'');updCnt()};
    document.getElementById('sOne').onclick=function(){setScope('one')};
    document.getElementById('sFut').onclick=function(){setScope('fut')};
    document.getElementById('sAll').onclick=function(){setScope('all')};
  }
  document.getElementById('eSave').onclick=function(){
    var a=parseFloat(document.getElementById('eAmt').value),nd=document.getElementById('eDate').value,rep=document.getElementById('eRep').value;
    if(!a||a<=0){document.getElementById('eAmt').focus();return}
    if(!nd){document.getElementById('eDate').focus();return}
    var name=document.getElementById('eName').value||(etype==='in'?'Income':'Expense');
    var cnt=parseInt(document.getElementById('eCnt').value);cnt=(rep!=='none'&&cnt>0)?cnt:null;
    var wasClr=(t.clr||[]).indexOf(ds)>-1;
    var tp=parse(ds),np=parse(nd);
    var shift=function(base){
      if(nd===ds)return base;
      var bb=parse(base);
      if(rep==='monthly'){
        var md=(np.getFullYear()-tp.getFullYear())*12+np.getMonth()-tp.getMonth();
        var dim=new Date(bb.getFullYear(),bb.getMonth()+md+1,0).getDate();
        return ymd(new Date(bb.getFullYear(),bb.getMonth()+md,Math.min(np.getDate(),dim)));
      }
      var diff=Math.round((np-tp)/86400000);
      return ymd(new Date(bb.getFullYear(),bb.getMonth(),bb.getDate()+diff));
    };
    var writes=[t];
    if(wasRec&&scope==='one'){
      t.skip=(t.skip||[]).concat(ds);
      t.clr=(t.clr||[]).filter(function(x){return x!==ds});
      var one={id:Date.now()+'',name:name,amt:a,type:etype,date:nd,repeat:'none',clr:wasClr?[nd]:[]};
      state.items.push(one);writes.push(one);
    }else if(wasRec&&scope==='fut'&&ds>t.date){
      var ns={id:Date.now()+'',name:name,amt:a,type:etype,date:nd,repeat:rep};
      if(cnt)ns.count=cnt;
      if(rep==='none'){ns.clr=wasClr?[nd]:[];ns.skip=[]}
      else{
        ns.clr=(t.clr||[]).filter(function(x){return x>=ds}).map(shift);
        ns.skip=(t.skip||[]).filter(function(x){return x>=ds}).map(shift);
        if(t.until)ns.until=shift(t.until);
      }
      t.clr=(t.clr||[]).filter(function(x){return x<ds});
      t.skip=(t.skip||[]).filter(function(x){return x<ds});
      t.until=ds;
      state.items.push(ns);writes.push(ns);
    }else if(wasRec&&rep!=='none'){
      if(nd!==ds){
        t.date=shift(t.date);
        t.clr=(t.clr||[]).map(shift);t.skip=(t.skip||[]).map(shift);
        if(t.until)t.until=shift(t.until);
      }
      t.name=name;t.amt=a;t.type=etype;t.repeat=rep;
      if(cnt)t.count=cnt;else delete t.count;
    }else{
      t.name=name;t.amt=a;t.type=etype;t.repeat=rep;t.date=nd;
      t.clr=wasClr?[nd]:[];t.skip=[];delete t.until;
      if(cnt)t.count=cnt;else delete t.count;
    }
    if(db)writes.forEach(function(w){db.collection('transactions').doc(w.id).set(w).catch(fail)});
    save();
    view=new Date(np.getFullYear(),np.getMonth(),1);
    openDay(nd);
  };
}
document.getElementById('gear').onclick=function(){
  sheet.className='sheet';sheet.innerHTML='<h2>Settings</h2><div class="lbl">Starting balance</div><input id="sStart" type="number" inputmode="decimal" value="'+(state.start||0)+'">'+
  '<div class="lbl">Currency symbol</div><input id="sCur" value="'+esc(state.cur)+'" maxlength="3">'+
  '<button class="primary" id="sSave">Save</button><button class="primary" id="sSync" style="background:var(--mute)">Sync setup</button>';
  bg.classList.add('on');
  document.getElementById('sSync').onclick=showSetup;
  document.getElementById('sSave').onclick=function(){state.start=parseFloat(document.getElementById('sStart').value)||0;state.cur=document.getElementById('sCur').value||'$';
    if(db)db.doc('settings/main').set({start:state.start,cur:state.cur}).catch(fail);
    save();closeSheet()};
};
render();
init();
</script>
